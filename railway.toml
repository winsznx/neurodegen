# Railway config — neurodegen-web service (Next.js frontend + read-only API routes).
# V2 ships on Railway only. Vercel has been removed.
#
# Pair this with a sibling Railway service that points at /railway.worker.toml
# (Service Settings → Config-as-Code Path). Both services live in the same
# Railway project so they share environment variables and reach each other via
# the internal DNS: <service-name>.railway.internal:<PORT>.

[build]
builder = "railpack"
buildCommand = "pnpm install --frozen-lockfile && pnpm build"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
drainingSeconds = 15

# ── Required environment variables on this service ──
# Most of these can be set as Project shared variables (Project Settings →
# Shared Variables) and pulled in as ${{ shared.VARIABLE_KEY }}.
#
#   NEXT_PUBLIC_APP_URL=https://<this-railway-public-url>
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
#   BSC_RPC_URL, BSC_RPC_URL_FALLBACK
#   ATTESTATION_CONTRACT_ADDRESS=0xe21f5ebec3f098c744c1e35db0c9338d6b717dc4
#   ADMIN_SECRET                          (shared with the worker)
#   WORKER_ADMIN_URL=http://${{ neurodegen-worker.RAILWAY_PRIVATE_DOMAIN }}:8080
#                                         (internal-DNS reference; no public exposure)
#   X402_REVENUE_ADDRESS=<your BSC payout address>
#   ENABLE_X402_INBOUND=true
#   ENABLE_X402_OUTBOUND=true
